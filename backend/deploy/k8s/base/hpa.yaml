apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: currencyflow
  namespace: currencyflow
  labels:
    app.kubernetes.io/name: currencyflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: currencyflow
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60      # 扩容冷却 60s
      policies:
        - type: Pods
          value: 4                         # 每次最多扩 4 个 Pod
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300     # 缩容冷却 5min，防止抖动
      policies:
        - type: Percent
          value: 25                        # 每次最多缩 25%
          periodSeconds: 120
  metrics:
    # 维度 1：CPU 使用率
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70           # CPU 平均 70% 触发扩容

    # 维度 2：内存使用率
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
