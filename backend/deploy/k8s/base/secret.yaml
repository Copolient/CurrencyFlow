# 生产环境应使用 Sealed Secrets 或 External Secrets Operator
# 此文件仅作为结构参考，不要提交真实凭据
apiVersion: v1
kind: Secret
metadata:
  name: currencyflow-secrets
  namespace: currencyflow
  labels:
    app.kubernetes.io/name: currencyflow
type: Opaque
stringData:
  jwt-secret: "CHANGE_ME_USE_SEALED_SECRET_OR_EXTERNAL_SECRET"
  db-dsn: "root:CHANGE_ME@tcp(mysql.database.svc.cluster.local:3306)/currencyflow?charset=utf8mb4&parseTime=True&loc=Local"
