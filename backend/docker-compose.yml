services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DB_DSN=root:example@tcp(mysql:3306)/currencyflow?charset=utf8mb4&parseTime=True&loc=Local
      - REDIS_ADDR=redis:6379
      - "JWT_SECRET=${JWT_SECRET:?set JWT_SECRET to a random 32+ char value}"
      - APP_PORT=:3000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: currencyflow
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
